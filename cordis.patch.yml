# dsh-balance-widget bundle patch: inserts the dual-face plugin row into the
# web profile roster. The row is a bare plugin by package name: the node half
# (exports ".") runs in the host process and registers the balance/cost API
# routes; the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: balance-widget
      name: 'dsh-balance-widget'
